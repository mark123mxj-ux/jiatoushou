services:
  postgres:
    image: postgres:16-alpine
    container_name: jiatoushou-postgres
    environment:
      POSTGRES_DB: jiatoushou
      POSTGRES_USER: jiatoushou
      POSTGRES_PASSWORD: jiatoushou
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data-service/sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiatoushou -d jiatoushou"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jiatoushou-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: